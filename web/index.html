<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="The Squared Away item workbench. Build rigs, boxes, pouches and your own add-ons."><title>ZoneBench · Squared Away</title><link rel="stylesheet" href="styles.css?v=fieldguide4"><link rel="stylesheet" href="armory.css?v=fieldguide4"><link rel="icon" href="favicon.svg"></head>
<body>
<div id="app">
  <header class="site-header">
    <button class="brand" type="button" aria-label="ZoneBench home">ZONEBENCH<small>TOOLS FOR THE ZONE</small></button>
    <nav id="site-nav" aria-label="Main navigation"></nav>
  </header>
  <div id="project-tools" class="project-toolbar" hidden>
    <span class="project-caption">YOUR WORKBENCH</span><span id="dirty"></span><div class="spacer"></div>
    <button hidden class="tool" id="btnMod">Update the mod</button>
    <button class="tool" id="btnLoad">Open project</button>
    <button class="tool primary" id="btnSave">Save project</button>
  </div>
  <input type="file" id="modIn" accept=".zip,application/zip" hidden>
  <input type="file" id="shareIn" accept=".json,application/json" hidden>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <input type="file" id="imgIn" accept="image/*" hidden>
  <nav id="nav" aria-label="Editor sections"></nav>
  <main>
    <div id="list"></div>
    <div id="pane"></div>
  </main>
</div>

<noscript>ZoneBench needs JavaScript to edit and export items. Your project stays in your browser.</noscript>
<script defer src="src/emit.js?v=fieldguide4"></script>
<script defer src="src/archive.js?v=fieldguide4"></script>
<script defer src="data/baseline.js?v=fieldguide4"></script>
<script defer src="src/compatibility.js?v=fieldguide4"></script>
<script defer src="vendor/appwrite-28.1.0.js?v=fieldguide4"></script>
<script defer src="src/community-config.js?v=fieldguide4"></script>
<script defer src="src/community-client.js?v=fieldguide4"></script>
<script defer src="src/addon-preview.js?v=fieldguide4"></script>
<script defer src="src/community-ui.js?v=fieldguide4"></script>
<script defer src="src/releases.js?v=fieldguide4"></script>
<script defer src="src/site.js?v=fieldguide4"></script>
<script defer src="src/introduction.js?v=fieldguide4"></script>
<script defer src="src/editor-view.js?v=fieldguide4"></script>
<script defer src="src/editor.js?v=fieldguide4"></script>
<script defer src="src/catalog.js?v=fieldguide4"></script>
</body></html>
